<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus Filter for YouTube</title>
  <link rel="stylesheet" href="options.css">
  <style>
    body { width: 292px; padding: 16px; }
    .card { padding: 14px; margin-bottom: 12px; }
    .stats { display: flex; gap: 6px; text-align: center; }
    .stat { flex: 1; padding: 8px 4px; border: 1px solid var(--line); border-radius: 9px; }
    .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 11px; color: var(--muted); }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .toggle strong { font-size: 14px; }
    .warn { padding: 10px 12px; border-radius: 9px; font-size: 12.5px; line-height: 1.45; }
    .warn.err { background: rgba(185, 28, 28, 0.12); color: var(--err); }
    .warn.info { background: rgba(37, 99, 235, 0.12); color: var(--accent); }
    button.wide { width: 100%; }
  </style>
</head>
<body>
  <div id="notice"></div>

  <div class="card toggle">
    <strong>Filtering</strong>
    <label class="check"><input type="checkbox" id="enabled"> <span id="enabledLabel">On</span></label>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b id="blocked">0</b><span>blocked</span></div>
      <div class="stat"><b id="allowed">0</b><span>allowed</span></div>
      <div class="stat"><b id="watched">0</b><span>watched</span></div>
      <div class="stat"><b id="apiCalls">0</b><span>API calls</span></div>
    </div>
    <p class="hint" id="thresholdLine" style="margin: 12px 0 0;"></p>
  </div>

  <button type="button" id="openOptions" class="primary wide">Settings</button>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
